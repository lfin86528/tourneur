backend:
  name: github
  repo: lfin86528/tourneur
  branch: main
  base_url: https://tourneur-decap-oauth.lino-finini.workers.dev
  auth_endpoint: auth

# Active l'édition en local sans GitHub quand vous lancez `npx decap-server`
# dans un second terminal (sans effet une fois déployé en production).
local_backend: true

media_folder: "public/images/pieces"
public_folder: "/images/pieces"

collections:
  - name: "pieces"
    label: "Créations"
    folder: "src/content/pieces"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Notes (optionnel)", name: "body", widget: "markdown", required: false }

  - name: "pages"
    label: "Pages"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Afficher dans le menu", name: "nav", widget: "boolean", default: true }
      - { label: "Ordre dans le menu", name: "navOrder", widget: "number", default: 100, hint: "Plus petit = plus à gauche. Accueil=0, Portfolio=20." }
      - { label: "Contenu", name: "body", widget: "markdown" }
